name: Android device smoke test
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  device:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: gradle --no-daemon assembleDebug assembleDebugAndroidTest
      - name: Build previous version for real update test
        run: |
          git fetch --depth=1 origin 9097473174af1396655fb9eb9ba77fc41908bdba
          git worktree add "$RUNNER_TEMP/previous-wagetrack" 9097473174af1396655fb9eb9ba77fc41908bdba
          gradle --no-daemon -p "$RUNNER_TEMP/previous-wagetrack" assembleDebug
          cp "$RUNNER_TEMP/previous-wagetrack/app/build/outputs/apk/debug/app-debug.apk" "$RUNNER_TEMP/previous-wagetrack.apk"
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install "$RUNNER_TEMP/previous-wagetrack.apk"
            adb install app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -e mode seed com.paydaytracker.app.debug.test/com.paydaytracker.app.UpgradeSmoke | tee upgrade-seed.txt
            grep -q 'WAGETRACK_UPGRADE_SEED_PASS' upgrade-seed.txt
            adb shell am force-stop com.paydaytracker.app.debug
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am instrument -w -e mode verify com.paydaytracker.app.debug.test/com.paydaytracker.app.UpgradeSmoke | tee upgrade-verify.txt
            grep -q 'WAGETRACK_UPGRADE_VERIFY_PASS' upgrade-verify.txt
            adb shell pm clear com.paydaytracker.app.debug
            adb shell pm revoke com.paydaytracker.app.debug android.permission.POST_NOTIFICATIONS
            adb shell am instrument -w -e mode blocked com.paydaytracker.app.debug.test/com.paydaytracker.app.DeviceSmoke | tee permission-blocked.txt
            grep -q 'PAYDAY_PERMISSION_BLOCKED_PASS' permission-blocked.txt
            adb shell pm grant com.paydaytracker.app.debug android.permission.POST_NOTIFICATIONS
            adb shell am instrument -w -e mode granted com.paydaytracker.app.debug.test/com.paydaytracker.app.DeviceSmoke | tee device-smoke.txt
            adb logcat -d > device-logcat.txt
            adb pull /sdcard/Android/data/com.paydaytracker.app.debug/files/device-smoke.png device-smoke.png || true
            adb pull /sdcard/Android/data/com.paydaytracker.app.debug/files/lock-screen.png lock-screen.png || true
            adb pull /sdcard/Android/data/com.paydaytracker.app.debug/files/pin-setup.png pin-setup.png || true
            adb pull /sdcard/Android/data/com.paydaytracker.app.debug/files/settings-icons-light.png settings-icons-light.png || true
            adb pull /sdcard/Android/data/com.paydaytracker.app.debug/files/settings-icons-dark.png settings-icons-dark.png || true
            adb pull /sdcard/Android/data/com.paydaytracker.app.debug/files/icon-gallery-light.png icon-gallery-light.png || true
            adb pull /sdcard/Android/data/com.paydaytracker.app.debug/files/icon-gallery-dark.png icon-gallery-dark.png || true
            grep -q 'PAYDAY_SMOKE_PASS' device-smoke.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-device-evidence
          path: |
            upgrade-seed.txt
            upgrade-verify.txt
            permission-blocked.txt
            device-smoke.txt
            device-logcat.txt
            device-smoke.png
            lock-screen.png
            pin-setup.png
            settings-icons-*.png
            icon-gallery-*.png
