name: Android device smoke test
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  device:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Compile app and native UI tests
        run: gradle --no-daemon --stacktrace assembleDebug assembleDebugAndroidTest
      - name: Run Compose smoke tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb shell wm size 1080x2340
            adb shell wm density 440
            adb logcat -c
            timeout 480s gradle --no-daemon connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.paydaytracker.app.DeviceSmoke,com.paydaytracker.app.UpgradeSmoke || { adb logcat -d > device-logcat.txt; adb pull /sdcard/Download/native-screens native-screens; exit 1; }
            adb logcat -d > device-logcat.txt
            adb pull /sdcard/Download/native-screens native-screens
      - name: Upload native test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-device-evidence
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            device-logcat.txt
            native-screens/
