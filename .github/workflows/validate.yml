name: Validate Android and UI
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile Android validation build (not distributed)
        run: gradle --no-daemon assembleDebug
      - name: Test UI
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install --with-deps chromium
          node tests/planning.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: UI-checks-validation
          path: test-results/
          if-no-files-found: ignore
